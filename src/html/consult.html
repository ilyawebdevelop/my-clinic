<section class="consult sect border-b-gray">
  <div class="container position-relative">

    <div class="sect-name">
      <span>консультация</span>
      <span class="sep"></span>
      <span class="sect-name-count">12</span>
    </div>

    <div class="grid-12 align-center">
      <div class="col-lg-5">

        <div class="sectHead">
          <h2 class="h2 h2--lg">
            Начните <span style="display: block;">с консультации</span>
          </h2>
        </div>

        <div class="sectDescr mb-5">
          Расскажите, что вас беспокоит. Администратор свяжется с вами, уточнит детали и предложит удобное время для
          визита.
        </div>

        <div class="consultForm">
          <div class="grid-12">
            <div class="col-lg-6">
              <div class="inputW">
                <input type="text" class="formInput" placeholder="Ваше имя">
              </div>
            </div>
            <div class="col-lg-6">
              <div class="inputW">
                <input type="tel" class="formInput" placeholder="Номер телефона">
              </div>
            </div>
            <div class="col-lg-12">
              <div class="d-flex gap-4">
                <div class="inputW w-100">
                  <textarea name="consultText" id="consultText" class="formText" style="height: 115px;"
                    placeholder="Что Вас беспокоит:"></textarea>
                </div>
                <button class="round-btn w-104 bg-brand-700">
                  <svg>
                    <use xlink:href="img/icons/icons.svg#submit-icon"></use>
                  </svg>
                </button>
              </div>
            </div>
            <div class="col-lg-12">
              <div class="agreement">
                <input type="checkbox" id="consultAgree" hidden>
                <label for="consultAgree">
                  <div class="rect"></div>
                  <div class="agreementText">
                    Отправляя данную форму, вы соглашаетесь с <a href="#">политикой конфиденциальности</a>
                  </div>
                </label>
              </div>
            </div>
          </div>
        </div>

      </div>
      <div class="col-lg-1">

      </div>
      <div class="col-lg-6">
        <div class="consultImageW">
          <img src="@img/admin/consult/image-1.jpg" alt="image">
          <img class="consultImageAbstr" src="@img/consult/abstract.svg" alt="abstract">
        </div>
      </div>
    </div>

  </div>
</section>
