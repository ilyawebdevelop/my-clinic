<section class="intro intro--home sect">
  <img class="intro-home-abstr-l" src="@img/intro/intro-home-abstr-l.svg" alt="icon">
  <div class="container">

    <div class="introGrid">
      <img class="introLogoR" src="@img/admin/intro/intro-logo-2.svg" alt="logo">
      <img src="@img/intro/intro-home-abstr-r.svg" alt="image" class="intro-home-abstr-r">
      <div class="introL">
        <h1 class="h1 title--white">
          <span>Центр <span class="button-linear">Стоматология, которой доверяют</span> имплантологии</span>
          и&nbsp;эстетической стоматологии
        </h1>
        <div class="d-flex flex-column align-center w-fit">
          <button class="main-btn button button--blue-dark border-hover-bottom pl-16 mb-2">
            <div class="icon">
              <svg style="fill: var(--brand-200);">
                <use xlink:href="img/icons/icons.svg#star"></use>
              </svg>
            </div>
            <span>записаться на консультацию</span>
          </button>
          <div class="text-center text-brand-400 mb-70">
            Для улыбки, которой захочется делиться
          </div>
        </div>
        <img src="@img/admin/intro/intro-logo-1.svg" alt="logo" class="introLogoL">
      </div>
      <div class="introR">
        <div class="introImage">
          <img src="@img/admin/intro/intro-home.jpg" alt="image">
        </div>
        <div class="spin-button-wrapper">
          <!-- Внутренний металлический круг с кастомной стрелкой Play -->
          <a data-fancybox href="@img/admin/video/video.mp4" class="play-btn w-105">
            <!-- Иконка кастомной стрелочки, похожей на вашу птичку/Play -->
            <svg style="fill: #29415f;">
              <use xlink:href="img/icons/icons.svg#play"></use>
            </svg>
          </a>

          <!-- Крутящийся текст вокруг -->
          <svg class="button-spin-text" viewBox="0 0 200 200" width="200" height="200">
            <defs>
              <!-- Идеальный круг радиусом 72px, ориентированный для правильного чтения текста -->
              <path id="circlePath" d="M 100, 100 m -72, 0 a 72,72 0 1,1 144,0 a 72,72 0 1,1 -144,0" />
            </defs>
            <text>
              <!-- Метод startOffset центрирует текст на круге -->
              <textPath href="#circlePath" startOffset="0%">
                УЗНАТЬ О КЛИНИКЕ ЗА ПОЛТОРЫ МИНУТЫ /
              </textPath>
            </text>
          </svg>
        </div>
      </div>
      <a href="#" class="intro-stock" style="background-image: url('@img/admin/intro/stock-1.jpg');">
        <div class="d-flex justify-between align-end">
          <div class="d-block">
            <div class="intro-stock-date mb-3">
              <span>Только до</span>
              <span>30 августа</span>
            </div>
            <img src="@img/admin/intro/stock-logo.svg" alt="logo" class="intro-stock-logo mb-3">
            <div class="fw-semibold mb-1 text-white intro-stock-price">
              18 000 ₽
            </div>
            <div class="line-trough text-white">
              23 000 ₽
            </div>
          </div>
          <div class="round-btn w-46 bg-opacity-40">
            <svg>
              <use xlink:href="img/icons/icons.svg#arrow-link"></use>
            </svg>
          </div>
        </div>

      </a>
    </div>

  </div>
</section>
