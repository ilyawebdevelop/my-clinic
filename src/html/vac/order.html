<section class="consult sect border-b-gray">
  <div class="container position-relative">

    <div class="sect-name">
      <span>консультация</span>
      <span class="sep"></span>
      <span class="sect-name-count">12</span>
    </div>

    <div class="grid-12 align-center">
      <div class="col-lg-5">

        <div class="mb-1">
          <h2 class="h2 h2--lg">
            Станьте частью <span>нашей команды</span>
          </h2>
        </div>

        <div class="sectDescr mb-3">
          Отправьте резюме, даже если сейчас нет открытой вакансии по вашему профилю. Мы внимательно рассмотрим отклик и
          свяжемся с вами, если ваш опыт подойдет задачам клиники.
        </div>

        <div class="consultForm">
          <div class="grid-12">
            <div class="col-lg-6">
              <div class="inputW">
                <input type="text" class="formInput" placeholder="Ваше имя">
              </div>
            </div>
            <div class="col-lg-6">
              <div class="inputW">
                <input type="tel" class="formInput" placeholder="Номер телефона">
              </div>
            </div>
            <div class="col-lg-12">
              <div class="inputW">
                <input type="text" class="formInput" placeholder="Интересующая вакансия">
              </div>
            </div>
            <div class="col-lg-12">
              <div class="fileWrap">
                <input type="file" class="fileInput" id="vacFile" hidden>
                <label class="d-flex gap-3 align-center" for="vacFile">
                  <svg>
                    <use xlink:href="img/icons/icons.svg#file"></use>
                  </svg>
                  <div class="fileOutput text--md">Прикрепить резюме</div>
                </label>
              </div>
            </div>
            <div class="col-lg-12">
              <div class="agreement">
                <input type="checkbox" id="consultAgree" hidden>
                <label for="consultAgree">
                  <div class="rect"></div>
                  <div class="agreementText">
                    Отправляя данную форму, вы соглашаетесь с <a href="#">политикой конфиденциальности</a>
                  </div>
                </label>
              </div>
            </div>
            <div class="col-lg-12">
              <button class="button button--brand-700 h-74 pr-16 pl-42 fz-15">
                Присоединиться к нам
                <div class="icon">
                  <svg>
                    <use xlink:href="img/icons/icons.svg#arrow-link"></use>
                  </svg>
                </div>
              </button>
            </div>
          </div>
        </div>

      </div>
      <div class="col-lg-1">

      </div>
      <div class="col-lg-6">
        <div class="consultImageW">
          <img src="@img/admin/vac/order.jpg" alt="image">
          <img class="consultImageAbstr" src="@img/consult/abstract.svg" alt="abstract">
        </div>
      </div>
    </div>

  </div>
</section>
